# Example workflow for projects that ADOPT flakeradar (not for this repo's own CI).
# This file is intentionally kept OUTSIDE .github/workflows/ so it never runs on
# its own in this repository. Copy it into YOUR project as
# .github/workflows/flakeradar.yml and adjust the test command to match your suite.
name: flakeradar

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # nightly, catches flakiness that only shows up over many runs

jobs:
  flaky-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install flakeradar
          pip install -e ".[dev]"   # your project's own dependencies

      - name: Restore flaky-test history across runs
        uses: actions/cache@v4
        with:
          path: .flakeradar/history.db
          key: flakeradar-history-${{ github.ref_name }}
          restore-keys: |
            flakeradar-history-main

      - name: Run tests with flakeradar tracking + quarantine skip
        run: pytest --flakeradar --flakeradar-quarantine

      - name: Save updated history
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .flakeradar/history.db
          key: flakeradar-history-${{ github.ref_name }}-${{ github.run_id }}

      - name: Update quarantine list
        if: always()
        env:
          # Optional: enable AI root-cause hints in the summary.
          FLAKERADAR_LLM_PROVIDER: groq
          FLAKERADAR_LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          flakeradar quarantine sync
          flakeradar report --out flakeradar-report.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flakeradar-report
          path: flakeradar-report.html
