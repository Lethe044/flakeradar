name: Publish to PyPI

# Trusted Publishing (OIDC) - no API token needed. This workflow must be
# registered as a "pending publisher" on PyPI first (or an active one, once
# the project exists there): see
# https://docs.pypi.org/trusted-publishers/adding-a-publisher/
#
# Runs whenever a GitHub Release is published. To publish a new version:
#   1. Bump the version in pyproject.toml and src/flakeradar/__init__.py
#   2. Commit, push, tag (e.g. git tag v1.1.1 && git push --tags)
#   3. Create a GitHub Release from that tag
# This workflow then builds and uploads it to PyPI automatically.

on:
  release:
    types: [published]
  workflow_dispatch: {} # allows a manual run from the Actions tab if needed

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/radarflake/
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
