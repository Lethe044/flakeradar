name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install flakeradar with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -v --cov=flakeradar --cov-report=term-missing

      - name: Verify CLI entry point
        run: flakeradar --version

  self-check:
    name: flakeradar dogfooding
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install flakeradar
        run: pip install -e ".[dev]"

      - name: Restore flaky-test history
        uses: actions/cache@v4
        with:
          path: .flakeradar/history.db
          key: flakeradar-history-${{ github.ref_name }}
          restore-keys: |
            flakeradar-history-main

      - name: Run flakeradar's own test suite with tracking enabled
        run: pytest --flakeradar -q

      - name: Save flaky-test history
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .flakeradar/history.db
          key: flakeradar-history-${{ github.ref_name }}-${{ github.run_id }}

      - name: Generate report
        if: always()
        run: flakeradar report --out flakeradar-report.html

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flakeradar-report
          path: flakeradar-report.html
